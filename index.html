          <p class="lede">Acá podés ver la heladera y el aire acondicionado, con sus fotos y detalles. Se venden por separado. Si estabas buscando alguno, capaz te sirve. Escribime y coordinamos para que vengas a verlo.</p>
          <div class="choice-grid">
            <a class="product-card" href="#/heladera" aria-label="Ver detalles de la heladera GAFA">
              <div class="card-photo"><img src="${products.heladera.photos[0][0]}" alt="Heladera GAFA blanca" loading="eager"></div>
              <div class="card-content"><p class="card-kicker">Heladera · GAFA</p><h2>374 litros con freezer</h2><p>4 años de uso · Enfría y congela sin problemas</p><div class="card-bottom"><span class="price">$470.000</span><span class="arrow-link" aria-hidden="true">${icon.arrow}</span></div></div>
            </a>
            <a class="product-card" href="#/aire" aria-label="Ver detalles del aire acondicionado SANSEI">
              <div class="card-photo"><img src="${products.aire.photos[0][0]}" alt="Aire acondicionado portátil SANSEI" loading="eager"></div>
              <div class="card-content"><p class="card-kicker">Aire portátil · SANSEI</p><h2>Frío/calor · aprox. 3.010 frigorías</h2><p>1 año de uso · Control remoto incluido</p><div class="card-bottom"><span class="price">$450.000</span><span class="arrow-link" aria-hidden="true">${icon.arrow}</span></div></div>
            </a>
          </div>
          <section class="contact-panel" aria-label="Contacto directo">
            <div class="contact-copy"><span class="contact-icon">${icon.wa}</span><div><h2>¿Querés venir a ver alguno?</h2><p>Escribime por WhatsApp y coordinamos el día y el horario.</p></div></div>
            <a class="button" href="${formatWhatsApp("Hola, vi que estás vendiendo algunas cosas por mudanza. Quería consultarte por uno de los productos.")}" target="_blank" rel="noopener noreferrer">Escribirme por WhatsApp ${icon.arrow}</a>
          </section>
          <div class="more-note"><p>Además de la heladera y el aire, estoy vendiendo una mesa, sillas plásticas, algunos muebles y otros artículos de cocina. Si querés saber qué más hay, escribime por WhatsApp.</p><a class="text-link" href="${formatWhatsApp("Hola, vi que también estás vendiendo otras cosas por mudanza. ¿Me contás qué hay?")}" target="_blank" rel="noopener noreferrer">Consultar por otros artículos ${icon.arrow}</a></div>
        </section>`;
    }

    function renderProduct(key) {
      const product = products[key];
      if (!product) { renderHome(); return; }
      currentProduct = key;
      currentPhoto = 0;
      const specs = product.specs.map(([label,value]) => `<div class="spec"><span class="spec-label">${label}</span><span class="spec-value">${value}</span></div>`).join("");
      const features = product.features.map((item) => `<li><span class="check">${icon.check}</span><span>${item}</span></li>`).join("");
      const thumbs = product.photos.map(([src,alt],index) => `<button class="thumb" type="button" data-photo="${index}" aria-label="Ver foto ${index+1}: ${alt}" aria-pressed="${index===0}"><img src="${src}" alt="" loading="lazy"></button>`).join("");
      app.innerHTML = `
        <section class="detail">
          <a class="back-link" href="#/">${icon.back} Volver a los productos</a>
          <div class="detail-grid">
            <div class="gallery">
              <div class="gallery-main" id="gallery-main" role="group" tabindex="0" aria-label="Foto principal del producto; presiona Enter para ampliar">
                <img id="main-photo" src="${product.photos[0][0]}" alt="${product.photos[0][1]}">
                <button class="gallery-arrow gallery-prev" type="button" aria-label="Foto anterior">${icon.back}</button>
                <button class="gallery-arrow gallery-next" type="button" aria-label="Foto siguiente">${icon.arrow}</button>
                <span class="gallery-count"><span id="photo-index">1</span> / ${product.photos.length}</span>
              </div>
              <div class="thumbs" aria-label="Elegir foto">${thumbs}</div>
            </div>
            <div class="product-info">
              <span class="eyebrow">${product.category}</span>
              <h1>${product.title}</h1>
              <p class="product-subtitle">${product.short}</p>
              <div class="price-line"><span class="detail-price">${product.price}</span><span class="price-label">precio en pesos</span></div>
              <div class="spec-grid">${specs}</div>
              <ul class="feature-list">${features}</ul>
              <div class="notice"><strong>Detalle para tener en cuenta:</strong> ${product.notice}</div>
              <p class="visit-note">Podés venir a ver este equipo. Escribime y coordinamos.</p>
              <div class="product-cta"><a class="button" href="${formatWhatsApp(product.message)}" target="_blank" rel="noopener noreferrer">${icon.wa} Escribirme por WhatsApp</a><a class="button button-light" href="#/">Ver el otro producto</a></div>
            </div>
          </div>
          <section class="detail-more"><h2>¿Querés pasar a verlo?</h2><p>Escribime y coordinamos para que vengas a ver el equipo. También estoy vendiendo una mesa, sillas plásticas, algunos muebles y otras cosas por mudanza.</p></section>
        </section>`;
      bindGallery(product);
    }

    function setPhoto(index) {
      if (!currentProduct) return;
      const product = products[currentProduct];
      currentPhoto = (index + product.photos.length) % product.photos.length;
      const [src,alt] = product.photos[currentPhoto];
      const main = document.getElementById("main-photo");
      if (main) { main.src = src; main.alt = alt; }
      const counter = document.getElementById("photo-index");
      if (counter) counter.textContent = String(currentPhoto + 1);
      document.querySelectorAll(".thumb").forEach((button,i) => button.setAttribute("aria-pressed", String(i === currentPhoto)));
    }

    function bindGallery(product) {
      document.querySelectorAll(".thumb").forEach((button) => button.addEventListener("click", () => setPhoto(Number(button.dataset.photo))));
      document.querySelector(".gallery-prev").addEventListener("click", (event) => { event.stopPropagation(); setPhoto(currentPhoto - 1); });
      document.querySelector(".gallery-next").addEventListener("click", (event) => { event.stopPropagation(); setPhoto(currentPhoto + 1); });
      const main = document.getElementById("gallery-main");
      main.addEventListener("click", (event) => { if (event.target.closest("button")) return; openLightbox(product.photos[currentPhoto]); });
      main.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openLightbox(product.photos[currentPhoto]); } });
    }

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = lightbox.querySelector("img");
    function openLightbox(photo) { lightboxImage.src = photo[0]; lightboxImage.alt = photo[1]; lightbox.classList.add("open"); lightbox.setAttribute("aria-hidden","false"); lightbox.querySelector("button").focus(); }
    function closeLightbox() { lightbox.classList.remove("open"); lightbox.setAttribute("aria-hidden","true"); lightboxImage.src = ""; }
    lightbox.querySelector("button").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (event) => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeLightbox(); });

    function route() {
      const key = location.hash.replace(/^#\/?/, "").split("/")[0];
      if (products[key]) renderProduct(key); else renderHome();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
